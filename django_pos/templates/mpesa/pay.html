
{% extends "pos/base.html" %}
{% load static %}

  {% block content %}

<div class="container">

    <div class="row">
       <h2 class="mt-5">Mpesa Payment</h2>
    </div>

        <div class="col-md-5">

            <form method="POST" action="{% url 'mpesa:pay'%}">
                {% csrf_token %}

                <label class="form-label mt-5">Phone Number</label>
                <input type="number" name="phone" value="254" class="form-control">

                <label class="form-label mt-5">Amount</label>
                <input type="number" name="amount" value="0" class="form-control">

                <input type="submit" name="submit" class="form-control mt-5 btn btn-success" value="pay">
            </form>

        </div>

        <div class="col-md-7">

        </div>

    </div>
</div>

 {% endblock %}
